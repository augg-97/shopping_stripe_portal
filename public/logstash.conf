input {
  beats {
    port => 5044
  }
}

filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # parse message string (JSON encoded) thành object
  json {
    source => "event.original"
    target => "parsed"
  }

  # copy field từ parsed ra root
  if [parsed] {
    mutate {
      add_field => {
        "label" => "%{[parsed][label]}"
        "level" => "%{[parsed][level]}"
        "message" => "%{[parsed][message]}"
        "serviceName" => "%{[parsed][serviceName]}"
        "timestamp" => "%{[parsed][timestamp]}"
        "traceId" => "%{[parsed][traceId]}"
        "stack" => "%{[parsed][stack]}"
      }
      remove_field => ["parsed"]
    }
  }

  # chuẩn hoá level
  if [level] {
    mutate {
      lowercase => ["level"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://sqs-elasticsearch:9200"]
    user => "elastic"
    password => "bQ5UroNM9PqslBs"
    
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "sqs-portal"
    data_stream_namespace => "default"
  }
  stdout { codec => rubydebug }
}
